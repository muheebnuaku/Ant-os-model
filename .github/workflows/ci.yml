name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antos
          POSTGRES_PASSWORD: antos
          POSTGRES_DB: antos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U antos" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Disposable database: the tests drop and re-create the schema.
      ANTOS_TEST_DATABASE_URL: postgresql+asyncpg://antos:antos@localhost:5432/antos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
