[project]
name = "antos-core"
version = "0.1.0"
description = "ANT-OS Ω deterministic reasoning engines and the 19-step reasoning contract (no I/O)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antos_core"]
