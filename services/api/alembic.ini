# Run from the repository root:  uv run alembic -c services/api/alembic.ini upgrade head
# The database URL comes from ANTOS_DATABASE_URL (see antos_api.settings).
[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
