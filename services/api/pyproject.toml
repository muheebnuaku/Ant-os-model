[project]
name = "antos-api"
version = "0.1.0"
description = "ANT-OS Ω platform service: API, audit store, escalations and the model gateway"
requires-python = ">=3.12"
dependencies = [
    "antos-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "anthropic>=0.75",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antos_api"]
